name: hgcal_v2
seed_everything: 42

data:
  topocluster_collection: LayerCluster
  particle_collection: SimCluster

  inputs:
    topocluster:
      - "e"
      - "eta"
      - "cosphi"
      - "sinphi"
      - "r"
      #- "z"
      #- "s"
      #- "theta"
      #- "phi"

  targets:
    particle:
      - e
      - eta
      - cosphi
      - sinphi
      - r

  num_objects: &num_particles 150

  train_path: /eos/user/m/mmarcheg/ml4reco/data/data_from_daniel_13ago26/parquet_out/output.parquet
  valid_path: /eos/user/m/mmarcheg/ml4reco/data/data_from_daniel_13ago26/parquet_out/output.parquet
  test_path: /eos/user/m/mmarcheg/ml4reco/data/data_from_daniel_13ago26/parquet_out/output.parquet

  num_workers: 16
  num_train: -1
  num_test: -1
  num_val: -1

  batch_size: 4
  incidence_cutval: 1e-4

  # Node-input transforms fitted on the LayerCluster collection, and particle-target
  # transforms fitted on the SimCluster collection. They share the keys e/eta/r
  # and MUST stay separate files; the regression task below gets the particle one.
  # Produce both with: sbatch jobs/norm_par_job.sh (see docs/NORMALIZATION_FIX.md)
  scale_dict_path: &scale_dict_path configs/hgcal_layercluster_var_transform.yaml
  particle_scale_dict_path: &particle_scale_dict_path configs/hgcal_simcluster_var_transform.yaml

trainer:
  max_epochs: 300
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 25
  default_root_dir: logs
  enable_progress_bar: True

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: hepattn-hgcal

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
        # every_n_train_steps: 1000
    # Keeps one copy of the best epoch so far as ckpts/best-epoch=NNN-val_loss=X.XXXXX.ckpt,
    # next to the per-epoch files of Checkpoint; the previous best-* file is removed when a
    # later epoch improves on it (src/callbacks/best_checkpoint.py).
    - class_path: callbacks.best_checkpoint.BestCheckpoint
      init_args:
        monitor: val/loss
    # Early stopping: ends the training when the total validation loss val/loss has not
    # decreased for `patience` consecutive epochs (src/callbacks/early_stopping.py). Remove
    # the entry to always train for max_epochs.
    - class_path: callbacks.early_stopping.EarlyStopping
      init_args:
        patience: 25
    - class_path: callbacks.prediction_writer.HGCPredictionWriter
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-6
    max: 8e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-4
    skip_scheduler: false

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      #dim: &dim 256
      dim: &dim 64

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 5
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 6
          dim: *dim
          attn_type: flash-varlen
          hybrid_norm: true
          value_residual: true
          num_register_tokens: 8
          attn_kwargs:
            num_heads: 16

      decoder:
        num_decoder_layers: 4
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          hybrid_norm: true
          attn_kwargs:
            num_heads: 16

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: classification
                input_object: query
                output_object: pflow
                target_object: particle
                num_classes: 3  # hadronic, electromagnetic, muon (+ null = residual, index 3)
                losses:
                  object_ce: 2
                costs:
                  object_ce: 2
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: 4  # num_classes + 1 (null)
                    hidden_layers: [256, 128, 32]
                null_weight: 0.5
                class_weights: [1.0, 1.0, 1.0]
                mask_queries: false
                has_intermediate_loss: true

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_constituent: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.1
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs:
                  # mask_bce: 5.0
                  mask_dice: 1.0
                dim: *dim
                null_weight: 1.0
                has_intermediate_loss: true

            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_constituent: node
                input_object: query
                output_object: pflow
                target_object: particle
                losses:
                  kl_div: 1.0
                costs:
                  kl_div: 1.0
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    hidden_layers: 2
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    hidden_layers: 1
                has_intermediate_loss: false

            - class_path: hepattn.models.task.IncidenceBasedRegressionTask
              init_args:
                name: regression
                fields: ["e", "eta", "sinphi", "cosphi", "r"]
                input_constituent: node
                input_object: query
                output_object: pflow
                target_object: particle
                loss: l1
                loss_weight: 10.0
                cost_weight: 10.0
                use_incidence: true
                use_nodes: true
                cost: new
                mode: scale
                scale_dict_path: *particle_scale_dict_path
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 134 # 2 * dim + len(fields) + 1 = 2×64 + 5 + 1 = 134
                    activation: torch.nn.SiLU
                    output_size: 5
                    hidden_layers: [128, 64, 32, 16, 8]
                has_intermediate_loss: false
