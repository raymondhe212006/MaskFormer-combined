stages:
  - build
  - test
  - tag
include:
  - project: 'cms-analysis/general/container-image-ci-templates'
    file:
      - 'kaniko-image.gitlab-ci.yml'
      - 'skopeo.gitlab-ci.yml'


variables:
  CONTEXT_DIR: ""
  DOCKER_FILE_NAME: "Dockerfile"
  KANIKO_EXTRA_ARGS: "--snapshot-mode=redo"
  GIT_SUBMODULE_STRATEGY: recursive
  PUSH_IMAGE: "true"
  ACCELERATED_IMAGE: "true"
  BUILD_ARGS: ""
  SCAN_IMAGE: "false"
  EOS_PATH: "/eos/user/m/mmarcheg/ml4reco/gitlab-ci/data"
#  HEPATTN_DIR: "$CI_PROJECT_DIR/hepattn"

.build_docker_template:
  extends: .build_kaniko
  only:
    - pushes
    - merge_requests
    - master

build_docker_python_3_12:
  extends: .build_docker_template
  variables:
    REGISTRY_IMAGE_PATH: ${CI_REGISTRY_IMAGE}:3.12-${CI_COMMIT_SHORT_SHA}

build_docker_python_3_12_latest:
  extends: .tag_skopeo
  rules:
   - if: '$CI_COMMIT_REF_NAME == "master"'
  variables:
    IMAGE_ORIGIN_TAG: ${CI_REGISTRY_IMAGE}:3.12-${CI_COMMIT_SHORT_SHA}
    IMAGE_DESTINATION_TAG: ${CI_REGISTRY_IMAGE}:3.12-latest

