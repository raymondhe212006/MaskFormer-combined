test_eos:
  stage: test
  tags:
    - eos
  script:
    - echo "Testing EOS access..."
    - bash tests/utils/test-eos

test_registry:
  stage: test
  script:
    - echo "Printing CI variables:"
    - env | grep "^CI_" | sort
    - echo "Printing REGISTRY variables"
    - env | grep "^REGISTRY_" | sort
    #- echo "Printing KANIKO variables"
    #- env | grep "^KANIKO_" | sort
    #- echo "Printing SKOPEO variables"
    #- env | grep "^SKOPEO_" | sort
    - echo "Printing DOCKER variables"
    - env | grep "^DOCKER_" | sort

